<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#121a2e"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5c7"/>
      <stop offset="100%" stop-color="#00b0d8"/>
    </linearGradient>
    <linearGradient id="mag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d94fe0"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5c7"/>
      <stop offset="100%" stop-color="#0a5d55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="220" fill="url(#glow)"/>
  <circle cx="1080" cy="280" r="200" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="#20304a" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- mixer console panel on right -->
  <g opacity="0.95">
    <rect x="770" y="60" width="380" height="240" rx="14" fill="#0f1830" stroke="#26365a" stroke-width="1.5"/>
    <!-- fader tracks -->
    <g>
      <rect x="805" y="90" width="10" height="180" rx="5" fill="#1c2b48"/>
      <rect x="805" y="150" width="10" height="120" rx="5" fill="url(#fader)"/>
      <rect x="792" y="140" width="36" height="14" rx="4" fill="#e8f6f3" stroke="#00e5c7" stroke-width="1.5"/>

      <rect x="855" y="90" width="10" height="180" rx="5" fill="#1c2b48"/>
      <rect x="855" y="190" width="10" height="80" rx="5" fill="url(#fader)"/>
      <rect x="842" y="180" width="36" height="14" rx="4" fill="#e8f6f3" stroke="#00e5c7" stroke-width="1.5"/>

      <rect x="905" y="90" width="10" height="180" rx="5" fill="#1c2b48"/>
      <rect x="905" y="120" width="10" height="150" rx="5" fill="url(#fader)"/>
      <rect x="892" y="110" width="36" height="14" rx="4" fill="#e8f6f3" stroke="#00e5c7" stroke-width="1.5"/>

      <rect x="955" y="90" width="10" height="180" rx="5" fill="#1c2b48"/>
      <rect x="955" y="170" width="10" height="100" rx="5" fill="url(#fader)"/>
      <rect x="942" y="160" width="36" height="14" rx="4" fill="#e8f6f3" stroke="#00e5c7" stroke-width="1.5"/>
    </g>

    <!-- eq knobs -->
    <g fill="none" stroke="#7c5cff" stroke-width="2.5">
      <circle cx="1030" cy="110" r="20"/>
      <circle cx="1080" cy="110" r="20"/>
      <circle cx="1030" cy="160" r="20"/>
      <circle cx="1080" cy="160" r="20"/>
    </g>
    <g stroke="#d94fe0" stroke-width="2.5" stroke-linecap="round">
      <line x1="1030" y1="110" x2="1038" y2="98"/>
      <line x1="1080" y1="110" x2="1072" y2="97"/>
      <line x1="1030" y1="160" x2="1024" y2="146"/>
      <line x1="1080" y1="160" x2="1090" y2="149"/>
    </g>

    <!-- waveform strip -->
    <polyline points="1005,240 1015,220 1025,255 1035,205 1045,250 1055,215 1065,245 1075,225 1085,248 1095,210 1105,240"
      fill="none" stroke="url(#mag)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- level dots -->
    <g fill="#00e5c7">
      <circle cx="795" cy="272" r="3"/>
      <circle cx="845" cy="272" r="3"/>
      <circle cx="895" cy="272" r="3"/>
      <circle cx="945" cy="272" r="3"/>
    </g>
  </g>

  <!-- background waveform decoration behind text -->
  <polyline points="60,300 90,290 110,310 140,280 170,305 200,270 230,300 260,285 290,308 320,275"
    fill="none" stroke="#1e3a52" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <!-- accent bar -->
  <rect x="62" y="112" width="66" height="6" rx="3" fill="url(#teal)"/>

  <text x="60" y="176" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="64" fill="#f3f8fb">
    <tspan x="60" y="176" textLength="1060" lengthAdjust="spacingAndGlyphs">Cubase Full Version</tspan>
    <tspan x="60" y="252" textLength="420" lengthAdjust="spacingAndGlyphs">Download</tspan>
  </text>

  <text x="60" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#9fb3c8">
    <tspan x="60" y="292" textLength="1080.0" lengthAdjust="spacingAndGlyphs" font-size="22.6">Skip manual installers — run one script and get full Cubase set up instantly.</tspan>
  </text>
</svg>